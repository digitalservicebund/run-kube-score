name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Semantic Release
        uses: digitalservicebund/semantic-release-action@e3acd4f7485a1c60f6c67b9c7257297461c16008 # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
