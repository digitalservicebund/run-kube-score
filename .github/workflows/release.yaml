name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Semantic Release
        uses: digitalservicebund/semantic-release-action@bbaf4074ec1729ce4a2f7be645a845cc4c7b2105 # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
